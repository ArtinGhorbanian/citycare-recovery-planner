version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: Asia/Tehran
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    groups:
      actions:
        patterns:
          - "*"
