name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Generate independent synthetic demo data
        run: >-
          python scripts/generate_citycare_demo_data.py
          --output "${RUNNER_TEMP}/citycare_demo_dataset.csv"
          --rows 6000
          --seed 42

      - name: Lint Python
        run: python -m ruff check app.py scripts tests

      - name: Scan Python for common security issues
        run: python -m bandit -q -r app.py scripts

      - name: Validate JavaScript syntax
        run: node --check static/script.js

      - name: Run tests
        run: python -m pytest

      - name: Smoke-test application bootstrap with synthetic data
        env:
          AI_ENABLED: "false"
          DATASET_PATH: ${{ runner.temp }}/citycare_demo_dataset.csv
          DEBUG: "false"
          HOST: "127.0.0.1"
        run: python -c "import app; assert app.MODEL_READY, app.STARTUP_ERROR"

      - name: Audit pinned runtime dependencies
        run: >-
          python -m pip_audit
          --requirement requirements.lock
          --no-deps
          --disable-pip
          --vulnerability-service osv
          --timeout 30
          --progress-spinner off
